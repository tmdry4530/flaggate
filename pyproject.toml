[project]
name = "flaggate"
version = "0.1.0"
description = "FlagGate: human-gated Flagsmith change plans."
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaggate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
