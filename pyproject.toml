[project]
name = "flaggate"
version = "0.1.0"
description = "FlagGate: human-gated Flagsmith change plans."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    # impact.py / verify.py: the SDK (pinned: the live-verify target) and the engine it evaluates with
    "flagsmith==6.3.0",
    "flagsmith-flag-engine>=11.1,<12",
    # approval tokens (Ed25519) + gatekeeper secrets at rest (scrypt + AES-GCM)
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fg = "flaggate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaggate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Flagsmith at 127.0.0.1:8600 (skipped when unreachable)"]
pythonpath = ["."]
