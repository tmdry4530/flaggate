# FlagGate MCP server for Codex CLI. Put this in a *project-local* or temporary CODEX config, or pass the same keys
# with -c overrides (see examples/agent_e2e/run_codex_e2e.py). fg-mcp holds no Flagsmith key: the only thing it
# needs is the gatekeeper's agent socket, which has no apply/rollback routes.
# Replace /path/to/flagsmith with your clone. The socket defaults to $FG_HOME/gatekeeper/agent.sock
# (FG_HOME defaults to ~/.flaggate); set FG_AGENT_SOCKET only if yours is elsewhere.
[mcp_servers.flaggate]
command = "/path/to/flagsmith/.venv/bin/fg-mcp"
args = []
# env = { FG_AGENT_SOCKET = "/path/to/fg-home/gatekeeper/agent.sock" }
startup_timeout_sec = 30
tool_timeout_sec = 120   # wait_for_result blocks up to 50 s per call
